<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pakistan House Price Prediction 🇵🇰</title>
    <style>
        /* Page layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #e8f5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Card container */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Title */
        h2 {
            margin-bottom: 25px;
            color: #2e7d32;
            font-size: 1.6em;
        }

        /* Input fields */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0px 0px 5px rgba(76, 175, 80, 0.3);
        }

        /* Button styling */
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #43a047;
        }

        /* Result box */
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f8e9;
            border: 1px solid #c8e6c9;
            border-radius: 10px;
            color: #2e7d32;
            font-weight: 600;
            font-size: 1.1em;
        }

        /* Responsive */
        @media (max-width: 500px) {
            body {
                margin: 20px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏠 Pakistan House Price Prediction 🇵🇰</h2>
        <form action="{{ url_for('predict') }}" method="post">
            <input type="number" step="1" name="bedrooms" placeholder="Bedrooms (e.g., 3)" required />
            <input type="number" step="1" name="baths" placeholder="Baths (e.g., 2)" required />
            <input type="number" step="0.1" name="area_marla" placeholder="Area in Marla (e.g., 5)" required />
            <button type="submit">Predict</button>
        </form>
        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>
</body>
</html>
